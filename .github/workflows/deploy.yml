name: Deploy Quartz to GitHub Pages

on:
  # 1) 本仓库（站点主题/配置）自身改动
  push:
    branches: [main]
  # 2) 笔记内容更新：由 Obsidian 仓库的 trigger-digital-garden.yml 跨仓库触发
  #    （因为本仓库构建时虽会 clone vault，但**不监听** vault 的 push）
  workflow_dispatch:
  # 3) 定时兜底已移除：GitHub 会在仓库连续 60 天无活动后自动禁用 schedule，
  #    原先的 cron 实际自 2026-08-24 起就已静默失效（且 Actions 的 cron 只保证
  #    "尽力而为"，实测执行时间从 06:47 漂到 03:31 UTC）。留着只会制造
  #    "以为有兜底"的错觉，故删除；上线由上面两条保证。

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout digital-garden repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Requires Pages Source = "GitHub Actions" in repo Settings → Pages
      - name: Configure GitHub Pages source
        uses: actions/configure-pages@v5

      # ── 克隆 Obsidian vault（--depth 1 浅克隆）──
      - name: Clone Obsidian vault
        run: |
          rm -rf content
          git clone --depth 1 \
            https://x-access-token:${{ secrets.OBSIDIAN_PAT }}@github.com/lyj090/Obsidian.git content

      # ── 叠加站点专属内容（如 02-Literature/index.md 索引入口）──
      - name: Overlay site-specific content
        run: cp -r content-extras/. content/

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # ── 缓存 Quartz 插件（避免每次 clone 46 个插件仓库）──
      - name: Restore Quartz plugin cache
        id: plugin-cache
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: quartz-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            quartz-plugins-

      - name: Install npm dependencies
        run: npm ci

      - name: Install Quartz plugins
        if: steps.plugin-cache.outputs.cache-hit != 'true'
        run: npx quartz plugin install

      - name: Build Quartz
        run: npx quartz build --concurrency 4

      - name: Disable Jekyll on static output
        run: touch public/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
